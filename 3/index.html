<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f1f0e9" />
  <title>工程計算機</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f1f0e9;
      --panel: #fffefa;
      --ink: #202b29;
      --muted: #76817b;
      --line: #d9ded6;
      --green: #1d735c;
      --green-dark: #155744;
      --lime: #d8ef83;
      --coral: #e67b60;
      --shadow: 0 24px 60px rgba(37, 50, 44, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(rgba(37, 50, 44, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(37, 50, 44, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      font-family: "Aptos", "Microsoft JhengHei", sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 34px 24px 48px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-family: "Rockwell", "Microsoft JhengHei", serif;
      font-size: 2rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .author {
      flex: 0 0 auto;
      padding: 9px 14px;
      border: 1px solid #cbd5c9;
      border-radius: 4px;
      background: rgba(255, 254, 250, 0.8);
      color: var(--green-dark);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      align-items: start;
      gap: 20px;
    }

    .calculator, .history-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .calculator { padding: 22px; }

    .display {
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      overflow: hidden;
      border: 1px solid #263c36;
      border-radius: 5px;
      background: #20342f;
      color: #f7f7ec;
    }

    .display-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #b5c7bd;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .mode-switch {
      display: inline-flex;
      padding: 3px;
      border: 1px solid #61736a;
      border-radius: 4px;
      background: #192923;
    }

    .mode-switch button {
      min-width: 43px;
      padding: 5px 8px;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: #bac7bf;
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .mode-switch button[aria-pressed="true"] {
      background: var(--lime);
      color: #27352c;
    }

    .expression {
      min-height: 31px;
      overflow-x: auto;
      color: #d8e1d9;
      font-size: 1.05rem;
      text-align: right;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    .result {
      overflow: hidden;
      color: #fff;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1.1;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
      margin-top: 14px;
    }

    .key {
      min-width: 0;
      min-height: 55px;
      padding: 8px 4px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #f7f8f3;
      color: var(--ink);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    .key:hover { transform: translateY(-2px); border-color: #aebdb1; background: #eef3e9; }
    .key:active { transform: translateY(0); }
    .key:focus-visible, .mode-switch button:focus-visible, .history-item:focus-visible { outline: 3px solid #e5a35b; outline-offset: 2px; }
    .key.function { background: #eaf0e7; color: var(--green-dark); font-size: 0.88rem; }
    .key.operator { background: #f7eee1; color: #8a512d; }
    .key.clear { background: #f9e9e4; border-color: #edc8bb; color: #9a4936; }
    .key.equals { background: var(--green); border-color: var(--green); color: white; font-size: 1.25rem; }
    .key.equals:hover { background: var(--green-dark); }

    .history-panel { padding: 18px; }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--line);
    }

    .history-head h2 { margin: 0; font-size: 1rem; }

    .clear-history {
      padding: 5px 7px;
      border: 0;
      background: transparent;
      color: var(--green);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .history-list { display: grid; gap: 3px; padding-top: 8px; }

    .history-item {
      display: block;
      width: 100%;
      padding: 11px 8px;
      border: 0;
      border-bottom: 1px solid #edf0e9;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-align: right;
    }

    .history-item:hover { background: #f5f7f0; }
    .history-expression { display: block; overflow: hidden; color: var(--muted); font-size: 0.78rem; text-overflow: ellipsis; white-space: nowrap; }
    .history-result { display: block; margin-top: 4px; font-size: 1.08rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .empty-history { margin: 18px 4px; color: var(--muted); font-size: 0.86rem; line-height: 1.6; }

    @media (max-width: 760px) {
      .page { padding: 24px 14px 32px; }
      .workspace { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .calculator { padding: 14px; }
      .history-panel { padding: 14px; }
      .history-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 420px) {
      .topbar { align-items: center; margin-bottom: 18px; }
      h1 { font-size: 1.65rem; }
      .author { padding: 8px 10px; font-size: 0.8rem; }
      .keypad { gap: 6px; }
      .key { min-height: 50px; font-size: 0.92rem; }
      .key.function { font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <p class="eyebrow">Scientific instrument / 01</p>
        <h1>工程計算機</h1>
      </div>
      <div class="author">林霆宇</div>
    </header>

    <div class="workspace">
      <section class="calculator" aria-label="工程計算機">
        <div class="display" aria-live="polite">
          <div class="display-meta">
            <span>計算結果</span>
            <div class="mode-switch" aria-label="角度單位">
              <button type="button" data-mode="DEG" aria-pressed="true">DEG</button>
              <button type="button" data-mode="RAD" aria-pressed="false">RAD</button>
            </div>
          </div>
          <div class="expression" id="expression">準備就緒</div>
          <div class="result" id="result">0</div>
        </div>

        <div class="keypad" id="keypad" aria-label="計算按鍵">
          <button class="key function" data-value="sin(" aria-label="正弦">sin</button>
          <button class="key function" data-value="cos(" aria-label="餘弦">cos</button>
          <button class="key function" data-value="tan(" aria-label="正切">tan</button>
          <button class="key function" data-value="sqrt(" aria-label="平方根">√</button>
          <button class="key clear" data-action="backspace" aria-label="刪除一字">⌫</button>

          <button class="key function" data-value="asin(" aria-label="反正弦">sin⁻¹</button>
          <button class="key function" data-value="acos(" aria-label="反餘弦">cos⁻¹</button>
          <button class="key function" data-value="atan(" aria-label="反正切">tan⁻¹</button>
          <button class="key function" data-value="log(" aria-label="常用對數">log</button>
          <button class="key function" data-value="ln(" aria-label="自然對數">ln</button>

          <button class="key function" data-value="π">π</button>
          <button class="key function" data-value="e">e</button>
          <button class="key function" data-value="^">xʸ</button>
          <button class="key function" data-value="!">n!</button>
          <button class="key operator" data-value="%">%</button>

          <button class="key" data-value="(">(</button>
          <button class="key" data-value=")">)</button>
          <button class="key clear" data-action="clear">AC</button>
          <button class="key operator" data-value="/">÷</button>
          <button class="key operator" data-value="*">×</button>

          <button class="key" data-value="7">7</button>
          <button class="key" data-value="8">8</button>
          <button class="key" data-value="9">9</button>
          <button class="key operator" data-value="-">−</button>
          <button class="key operator" data-value="+">+</button>

          <button class="key" data-value="4">4</button>
          <button class="key" data-value="5">5</button>
          <button class="key" data-value="6">6</button>
          <button class="key" data-value="." aria-label="小數點">.</button>
          <button class="key equals" data-action="equals" aria-label="計算">=</button>

          <button class="key" data-value="1">1</button>
          <button class="key" data-value="2">2</button>
          <button class="key" data-value="3">3</button>
          <button class="key" data-value="0">0</button>
          <button class="key" data-value="00">00</button>
        </div>
      </section>

      <aside class="history-panel" aria-label="計算紀錄">
        <div class="history-head">
          <h2>計算紀錄</h2>
          <button class="clear-history" id="clearHistory" type="button">清除</button>
        </div>
        <div class="history-list" id="historyList">
          <p class="empty-history">完成計算後，結果會留在這裡。</p>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const expressionDisplay = document.getElementById("expression");
    const resultDisplay = document.getElementById("result");
    const historyList = document.getElementById("historyList");
    let expression = "";
    let angleMode = "DEG";
    let justEvaluated = false;
    const history = [];

    function tokenize(source) {
      const tokens = [];
      let remaining = source;
      while (remaining.length) {
        remaining = remaining.replace(/^\s+/, "");
        if (!remaining) break;
        const number = remaining.match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);
        if (number) {
          tokens.push({ type: "number", value: Number(number[0]) });
          remaining = remaining.slice(number[0].length);
          continue;
        }
        const identifier = remaining.match(/^[a-zA-Z]+|^π/);
        if (identifier) {
          tokens.push({ type: "identifier", value: identifier[0] });
          remaining = remaining.slice(identifier[0].length);
          continue;
        }
        const symbol = remaining[0];
        if ("()+-*/^!%".includes(symbol)) {
          tokens.push({ type: symbol, value: symbol });
          remaining = remaining.slice(1);
          continue;
        }
        throw new Error("無法辨識的符號");
      }
      return tokens;
    }

    function evaluate(source) {
      const tokens = tokenize(source);
      let position = 0;
      const peek = () => tokens[position];
      const take = (type) => {
        if (!peek() || peek().type !== type) throw new Error("算式不完整");
        return tokens[position++];
      };

      function parseAdditive() {
        let value = parseMultiplicative();
        while (peek() && (peek().type === "+" || peek().type === "-")) {
          const operator = tokens[position++].type;
          const right = parseMultiplicative();
          value = operator === "+" ? value + right : value - right;
        }
        return value;
      }

      function parseMultiplicative() {
        let value = parseUnary();
        while (peek() && (peek().type === "*" || peek().type === "/")) {
          const operator = tokens[position++].type;
          const right = parseUnary();
          value = operator === "*" ? value * right : value / right;
        }
        return value;
      }

      function parseUnary() {
        if (peek() && (peek().type === "+" || peek().type === "-")) {
          const operator = tokens[position++].type;
          const value = parseUnary();
          return operator === "-" ? -value : value;
        }
        return parsePower();
      }

      function parsePower() {
        let value = parsePostfix();
        if (peek() && peek().type === "^") {
          position++;
          value = Math.pow(value, parseUnary());
        }
        return value;
      }

      function parsePostfix() {
        let value = parsePrimary();
        while (peek() && (peek().type === "!" || peek().type === "%")) {
          const operator = tokens[position++].type;
          if (operator === "%") {
            value /= 100;
          } else {
            if (value < 0 || !Number.isInteger(value) || value > 170) throw new Error("階乘限非負整數且不大於 170");
            let product = 1;
            for (let factor = 2; factor <= value; factor++) product *= factor;
            value = product;
          }
        }
        return value;
      }

      function parsePrimary() {
        const token = peek();
        if (!token) throw new Error("算式不完整");
        if (token.type === "number") {
          position++;
          return token.value;
        }
        if (token.type === "(") {
          position++;
          const value = parseAdditive();
          take(")");
          return value;
        }
        if (token.type === "identifier") {
          position++;
          const name = token.value;
          if (name === "π") return Math.PI;
          if (name === "e") return Math.E;
          if (!peek() || peek().type !== "(") throw new Error("函數需要括號參數");
          position++;
          const argument = parseAdditive();
          take(")");
          const angle = angleMode === "DEG" ? argument * Math.PI / 180 : argument;
          const functions = {
            sin: () => Math.sin(angle),
            cos: () => Math.cos(angle),
            tan: () => Math.tan(angle),
            asin: () => angleMode === "DEG" ? Math.asin(argument) * 180 / Math.PI : Math.asin(argument),
            acos: () => angleMode === "DEG" ? Math.acos(argument) * 180 / Math.PI : Math.acos(argument),
            atan: () => angleMode === "DEG" ? Math.atan(argument) * 180 / Math.PI : Math.atan(argument),
            sqrt: () => Math.sqrt(argument),
            log: () => Math.log10(argument),
            ln: () => Math.log(argument)
          };
          if (!functions[name]) throw new Error("不支援的函數");
          return functions[name]();
        }
        throw new Error("算式不完整");
      }

      const value = parseAdditive();
      if (position !== tokens.length) throw new Error("算式格式錯誤");
      if (!Number.isFinite(value)) throw new Error("結果超出範圍");
      return value;
    }

    function formatNumber(value) {
      if (Object.is(value, -0)) value = 0;
      return Number(value.toPrecision(12)).toString();
    }

    function updateDisplay() {
      expressionDisplay.textContent = expression || "準備就緒";
      if (!expression) {
        resultDisplay.textContent = "0";
        return;
      }
      try {
        resultDisplay.textContent = formatNumber(evaluate(expression));
      } catch {
        resultDisplay.textContent = "···";
      }
    }

    function renderHistory() {
      historyList.replaceChildren();
      if (!history.length) {
        const empty = document.createElement("p");
        empty.className = "empty-history";
        empty.textContent = "完成計算後，結果會留在這裡。";
        historyList.append(empty);
        return;
      }
      history.slice().reverse().forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "history-item";
        button.innerHTML = `<span class="history-expression"></span><span class="history-result"></span>`;
        button.querySelector(".history-expression").textContent = `${item.expression} =`;
        button.querySelector(".history-result").textContent = item.result;
        button.addEventListener("click", () => {
          expression = item.expression;
          justEvaluated = false;
          updateDisplay();
        });
        historyList.append(button);
      });
    }

    function calculate() {
      if (!expression) return;
      try {
        const value = evaluate(expression);
        const result = formatNumber(value);
        history.push({ expression, result });
        renderHistory();
        expression = result;
        justEvaluated = true;
        updateDisplay();
      } catch (error) {
        resultDisplay.textContent = error.message;
      }
    }

    function appendValue(value) {
      const isContinuation = /^[+*/^%!)\-]$/.test(value);
      if (justEvaluated && !isContinuation) expression = "";
      justEvaluated = false;
      expression += value;
      updateDisplay();
    }

    document.getElementById("keypad").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.action === "clear") {
        expression = "";
        justEvaluated = false;
        updateDisplay();
      } else if (button.dataset.action === "backspace") {
        expression = expression.slice(0, -1);
        justEvaluated = false;
        updateDisplay();
      } else if (button.dataset.action === "equals") {
        calculate();
      } else {
        appendValue(button.dataset.value);
      }
    });

    document.querySelectorAll("[data-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        angleMode = button.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach((modeButton) => {
          modeButton.setAttribute("aria-pressed", String(modeButton === button));
        });
        updateDisplay();
      });
    });

    document.getElementById("clearHistory").addEventListener("click", () => {
      history.length = 0;
      renderHistory();
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9.]$/.test(event.key) || "+-*/^()%!".includes(event.key)) {
        appendValue(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        calculate();
      } else if (event.key === "Backspace") {
        expression = expression.slice(0, -1);
        justEvaluated = false;
        updateDisplay();
      } else if (event.key === "Escape") {
        expression = "";
        justEvaluated = false;
        updateDisplay();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
