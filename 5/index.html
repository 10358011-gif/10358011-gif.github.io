<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>網頁計數器</title>
  <script>
    if (new URLSearchParams(location.search).has("compact")) {
      document.documentElement.classList.add("compact");
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --paper: #f7f8fc;
      --white: #fff;
      --accent: #ff6b4a;
      --accent-dark: #d94d31;
      --line: #e6e9f0;
      --shadow: 0 18px 48px rgba(23, 32, 51, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 87% 2%, rgba(255, 224, 212, 0.75), transparent 30rem),
        var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.65;
    }

    .counter-card {
      width: min(100%, 480px);
      padding: clamp(28px, 7vw, 52px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--white);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent-dark);
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.17em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .description {
      margin: 10px 0 28px;
      color: var(--muted);
    }

    .count {
      display: block;
      overflow-wrap: anywhere;
      margin: 0 0 28px;
      color: var(--accent-dark);
      font-size: clamp(3.5rem, 18vw, 6rem);
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      line-height: 1.1;
    }

    .status {
      min-height: 1.65em;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status.error { color: #b42318; }

    html.compact body {
      display: block;
      min-width: 0;
      min-height: 0;
      padding: 0;
      background: transparent;
    }

    html.compact .counter-card {
      width: 100%;
      padding: 9px 13px;
      border-radius: 14px;
      text-align: left;
    }

    html.compact .eyebrow { display: none; }
    html.compact h1 { font-size: 1.15rem; }
    html.compact .description { display: none; }

    html.compact .count {
      margin: 3px 0 6px;
      font-size: 2rem;
    }

    html.compact .status {
      min-height: 1.3em;
      margin-top: 4px;
      font-size: 0.72rem;
    }
  </style>
</head>
<body>
  <main class="counter-card">
    <p class="eyebrow">SIMPLE COUNTER</p>
    <h1>網頁計數器</h1>
    <p class="description">每次開啟網頁時自動增加一次計數</p>
    <output class="count" id="count" aria-live="polite">—</output>
    <p class="status" id="status" role="status">正在記錄本次開啟…</p>
  </main>

  <script>
    (() => {
      const countDisplay = document.querySelector("#count");
      const status = document.querySelector("#status");
      const formatter = new Intl.NumberFormat("zh-TW");
      const gasRunner = typeof google !== "undefined" && google.script && google.script.run;
      let backendUrl = "https://script.google.com/macros/s/AKfycbx0FP_SFs0CTpcxEA23AnodS8_7m-nsG9zGyycFnLfcwCbG72WScqPEerr5HhWsHUz3/exec";

      function showCount(value) {
        countDisplay.textContent = formatter.format(value);
      }

      function showError(error) {
        status.textContent = error && error.message
          ? `操作失敗：${error.message}`
          : "操作失敗，請稍後再試。";
        status.classList.add("error");
      }

      function callBackend(action, onSuccess, onFailure) {
        if (gasRunner) {
          gasRunner
            .withSuccessHandler(value => {
              if (!Number.isSafeInteger(value) || value < 0) {
                onFailure(new Error("GAS 回傳了無效的計數資料。"));
                return;
              }
              onSuccess(value);
            })
            .withFailureHandler(onFailure)[action]();
          return;
        }

        if (!backendUrl) {
          onFailure(new Error("計數服務尚未設定網址。"));
          return;
        }

        const callbackName = `gasCounterCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const endpoint = new URL(backendUrl);
        endpoint.searchParams.set("action", action);
        endpoint.searchParams.set("callback", callbackName);
        endpoint.searchParams.set("_", String(Date.now()));

        let timeout;
        const cleanup = () => {
          clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        };

        window[callbackName] = response => {
          cleanup();
          if (!response || response.error) {
            onFailure(new Error(response && response.error
              ? response.error
              : "GAS 回傳了無效的資料。"));
          } else if (!Number.isSafeInteger(response.value) || response.value < 0) {
            onFailure(new Error("GAS 回傳了無效的計數資料。"));
          } else {
            onSuccess(response.value);
          }
        };
        script.onerror = () => {
          cleanup();
          onFailure(new Error("無法連線到 GAS，請確認網址、部署版本與存取權設定。"));
        };
        timeout = setTimeout(() => {
          cleanup();
          onFailure(new Error("GAS 連線逾時，請稍後再試。"));
        }, 15000);
        script.src = endpoint.toString();
        document.head.append(script);
      }

      callBackend("incrementCount", value => {
        showCount(value);
        status.textContent = "本次開啟已記錄一次。";
      }, showError);
    })();
  </script>
</body>
</html>
