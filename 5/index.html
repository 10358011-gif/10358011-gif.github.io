<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>網頁計數器</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --paper: #f7f8fc;
      --white: #fff;
      --accent: #ff6b4a;
      --accent-dark: #d94d31;
      --line: #e6e9f0;
      --shadow: 0 18px 48px rgba(23, 32, 51, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 87% 2%, rgba(255, 224, 212, 0.75), transparent 30rem),
        var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.65;
    }

    .counter-card {
      width: min(100%, 480px);
      padding: clamp(28px, 7vw, 52px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--white);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent-dark);
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.17em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .description {
      margin: 10px 0 28px;
      color: var(--muted);
    }

    .connection-form {
      display: grid;
      gap: 10px;
      margin: 0 0 24px;
      text-align: left;
    }

    .connection-form[hidden] { display: none; }

    .connection-form label {
      font-size: 0.9rem;
      font-weight: 750;
    }

    .connection-controls {
      display: flex;
      gap: 8px;
    }

    .connection-controls input {
      width: 100%;
      min-width: 0;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      font: inherit;
      font-size: 0.9rem;
    }

    .connection-controls input:focus-visible {
      outline: 3px solid #e8a277;
      outline-offset: 2px;
    }

    .connect-button {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 14px;
      background: var(--ink);
      color: var(--white);
      font-size: 0.9rem;
    }

    .count {
      display: block;
      overflow-wrap: anywhere;
      margin: 0 0 28px;
      color: var(--accent-dark);
      font-size: clamp(3.5rem, 18vw, 6rem);
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      line-height: 1.1;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    button {
      min-height: 50px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-radius: 12px;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease, opacity 150ms ease;
    }

    button:hover:not(:disabled) { transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #e8a277; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: 0.55; }

    .change-button {
      min-width: 66px;
      background: var(--accent);
      color: var(--white);
      font-size: 1.4rem;
    }

    .change-button:hover:not(:disabled) { background: var(--accent-dark); }

    .reset-button {
      border-color: var(--line);
      background: var(--paper);
      color: var(--ink);
    }

    .status {
      min-height: 1.65em;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status.error { color: #b42318; }

    @media (max-width: 420px) {
      .controls { gap: 8px; }
      button { padding: 0 14px; }
      .change-button { min-width: 56px; }
    }
  </style>
</head>
<body>
  <main class="counter-card">
    <p class="eyebrow">SIMPLE COUNTER</p>
    <h1>網頁計數器</h1>
    <p class="description">使用下方按鈕增減並儲存計數</p>
    <form class="connection-form" id="connection-form" hidden>
      <label for="gas-url">GAS 網頁應用程式網址（結尾為 /exec）</label>
      <div class="connection-controls">
        <input id="gas-url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec" required>
        <button class="connect-button" id="connect" type="submit">連線</button>
      </div>
    </form>
    <output class="count" id="count" aria-live="polite">—</output>
    <div class="controls" aria-label="計數器操作">
      <button class="change-button" id="decrement" type="button" aria-label="減一">−</button>
      <button class="change-button" id="increment" type="button" aria-label="加一">＋</button>
      <button class="reset-button" id="reset" type="button">重設</button>
    </div>
    <p class="status" id="status" role="status">正在載入計數…</p>
  </main>

  <script>
    (() => {
      const countDisplay = document.querySelector("#count");
      const status = document.querySelector("#status");
      const buttons = [...document.querySelectorAll("button")];
      const decrementButton = document.querySelector("#decrement");
      const connectButton = document.querySelector("#connect");
      const connectionForm = document.querySelector("#connection-form");
      const gasUrlInput = document.querySelector("#gas-url");
      const formatter = new Intl.NumberFormat("zh-TW");
      const gasRunner = typeof google !== "undefined" && google.script && google.script.run;
      let busy = false;
      let connected = false;
      let count = 0;
      let backendUrl = "";

      function showCount(value) {
        count = value;
        countDisplay.textContent = formatter.format(value);
        decrementButton.disabled = busy || value === 0;
      }

      function setBusy(value) {
        busy = value;
        buttons.forEach(button => {
          button.disabled = value ||
            (!connected && button !== connectButton) ||
            (button === decrementButton && count === 0);
        });
      }

      function showError(error) {
        setBusy(false);
        status.textContent = error && error.message
          ? `操作失敗：${error.message}`
          : "操作失敗，請稍後再試。";
        status.classList.add("error");
      }

      function callBackend(action, onSuccess, onFailure) {
        if (gasRunner) {
          gasRunner
            .withSuccessHandler(value => {
              if (!Number.isSafeInteger(value) || value < 0) {
                onFailure(new Error("GAS 回傳了無效的計數資料。"));
                return;
              }
              onSuccess(value);
            })
            .withFailureHandler(onFailure)[action]();
          return;
        }

        if (!backendUrl) {
          onFailure(new Error("請先輸入 GAS 網頁應用程式網址並連線。"));
          return;
        }

        const callbackName = `gasCounterCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const endpoint = new URL(backendUrl);
        endpoint.searchParams.set("action", action);
        endpoint.searchParams.set("callback", callbackName);
        endpoint.searchParams.set("_", String(Date.now()));

        let timeout;
        const cleanup = () => {
          clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        };

        window[callbackName] = response => {
          cleanup();
          if (!response || response.error) {
            onFailure(new Error(response && response.error
              ? response.error
              : "GAS 回傳了無效的資料。"));
          } else if (!Number.isSafeInteger(response.value) || response.value < 0) {
            onFailure(new Error("GAS 回傳了無效的計數資料。"));
          } else {
            onSuccess(response.value);
          }
        };
        script.onerror = () => {
          cleanup();
          onFailure(new Error("無法連線到 GAS，請確認網址、部署版本與存取權設定。"));
        };
        timeout = setTimeout(() => {
          cleanup();
          onFailure(new Error("GAS 連線逾時，請稍後再試。"));
        }, 15000);
        script.src = endpoint.toString();
        document.head.append(script);
      }

      function normalizeBackendUrl(value) {
        const url = new URL(value.trim());
        if (
          url.protocol !== "https:" ||
          url.hostname !== "script.google.com" ||
          !url.pathname.includes("/macros/") ||
          !url.pathname.endsWith("/exec")
        ) {
          throw new Error("請使用 Google Apps Script 部署後提供的 https://script.google.com/.../exec 網址。");
        }

        url.search = "";
        url.hash = "";
        return url.toString();
      }

      function connectToBackend(url) {
        backendUrl = url;
        connected = false;
        setBusy(true);
        status.classList.remove("error");
        status.textContent = "正在連線至 GAS…";

        callBackend("getCount", value => {
          connected = true;
          showCount(value);
          setBusy(false);
          try {
            localStorage.setItem("gasCounterWebAppUrl", url);
          } catch {
            status.textContent = "已連線；瀏覽器未能記住網址，下次開啟時需重新輸入。";
            return;
          }
          status.textContent = "已連線，計數已載入。";
        }, showError);
      }

      connectionForm.addEventListener("submit", event => {
        event.preventDefault();
        let url;
        try {
          url = normalizeBackendUrl(gasUrlInput.value);
        } catch (error) {
          showError(error);
          return;
        }

        gasUrlInput.value = url;
        connectToBackend(url);
      });

      function runAction(action, successMessage) {
        if (busy) return;
        setBusy(true);
        status.classList.remove("error");
        status.textContent = "正在更新…";

        callBackend(action, value => {
          showCount(value);
          setBusy(false);
          status.textContent = successMessage;
        }, showError);
      }

      document.querySelector("#increment").addEventListener("click", () => {
        runAction("incrementCount", "已加一。");
      });

      decrementButton.addEventListener("click", () => {
        runAction("decrementCount", "已減一。");
      });

      document.querySelector("#reset").addEventListener("click", () => {
        runAction("resetCount", "計數已重設。");
      });

      setBusy(true);
      if (gasRunner) {
        callBackend("getCount", value => {
          connected = true;
          showCount(value);
          setBusy(false);
          status.textContent = "計數已載入。";
        }, showError);
      } else {
        connectionForm.hidden = false;
        try {
          const savedUrl = localStorage.getItem("gasCounterWebAppUrl");
          if (savedUrl) {
            const url = normalizeBackendUrl(savedUrl);
            gasUrlInput.value = url;
            connectToBackend(url);
          } else {
            setBusy(false);
            status.textContent = "請輸入 GAS 網頁應用程式網址，連線後即可載入共用計數。";
          }
        } catch (error) {
          showError(error);
        }
      }
    })();
  </script>
</body>
</html>
